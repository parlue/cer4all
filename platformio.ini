[platformio]
default_envs = cer4all_s3mini, cer4all_s3wroom

[env]
platform = espressif32 @ 6.8.1
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_flags = -Iinclude

[env:cer4all_s3mini]
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.cmake_extra_args = -DCER4ALL_BOARD=mini
build_flags = ${env.build_flags} -DCER4ALL_MINI=1

[env:cer4all_s3wroom]
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.cmake_extra_args = -DCER4ALL_BOARD=wroom
build_flags = ${env.build_flags} -DCER4ALL_WROOM=1

<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cer4all Diagnose</title>
<style>body{font:16px system-ui;background:#141b26;color:#e5edf6;max-width:920px;margin:auto;padding:24px}button,select{font:inherit;padding:12px;margin:5px;border-radius:8px}pre{background:#202c3d;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}#log{max-height:50vh;overflow:auto}a{color:#8bc5ff}</style>
<h1>cer4all Diagnose</h1><p>Zusätzliche BLE-Verbindung. Der Nordic-UART-Dienst der Schachanwendung wird nicht verwendet.</p>
<button id="connect">Verbinden</button><button id="refresh" disabled>Status lesen</button><button id="save">Log speichern</button><button id="disconnect" disabled>Trennen</button>
<pre id="status">Nicht verbunden.</pre>
<p>Nur vor einer Anwendungssitzung ändern:</p><select id="mode"><option>LEDS AUTO</option><option>LEDS MONO</option><option>LEDS RGB</option><option>FILTER 0</option><option>FILTER 1</option></select><button id="send" disabled>Übernehmen</button>
<pre id="log"></pre><p><a href="index.html">Firmware</a></p>
<script>
const serviceId='ce4c0000-5887-4d42-9888-31489f8ca144';
let device,statusCharacteristic,logCharacteristic;let entries=[];const decoder=new TextDecoder();
const el=id=>document.getElementById(id);
function log(text){entries.push(new Date().toISOString()+' '+text);el('log').textContent=entries.slice(-500).join('\n');}
function connected(on){for(const id of ['refresh','send','disconnect'])el(id).disabled=!on;el('connect').disabled=on;}
async function refresh(){const value=await statusCharacteristic.readValue();const text=decoder.decode(value);try{el('status').textContent=JSON.stringify(JSON.parse(text),null,2);}catch{el('status').textContent=text;}log('STATUS '+text);}
async function run(action){try{await action();}catch(e){log('FEHLER '+e.message);}}
el('connect').onclick=()=>run(async()=>{
 if(!navigator.bluetooth)throw new Error('Web Bluetooth fehlt. Chrome/Edge über HTTPS oder localhost verwenden.');
 device=await navigator.bluetooth.requestDevice({filters:[{name:'Certabo',services:[serviceId]}],optionalServices:[serviceId]});
 device.addEventListener('gattserverdisconnected',()=>{connected(false);el('status').textContent='Verbindung getrennt.';log('Getrennt');});
 const server=await device.gatt.connect();const service=await server.getPrimaryService(serviceId);
 statusCharacteristic=await service.getCharacteristic('ce4c0001-5887-4d42-9888-31489f8ca144');
 logCharacteristic=await service.getCharacteristic('ce4c0002-5887-4d42-9888-31489f8ca144');
 logCharacteristic.addEventListener('characteristicvaluechanged',event=>log(decoder.decode(event.target.value,{stream:true})));
 await logCharacteristic.startNotifications();connected(true);await refresh();
});
el('refresh').onclick=()=>run(refresh);
el('send').onclick=()=>run(async()=>{await statusCharacteristic.writeValueWithResponse(new TextEncoder().encode(el('mode').value));log('Befehl: '+el('mode').value);await refresh();});
el('disconnect').onclick=()=>device?.gatt.disconnect();
el('save').onclick=()=>{const url=URL.createObjectURL(new Blob([entries.join('\n')+'\n'],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='cer4all-log-'+new Date().toISOString().replaceAll(':','-')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
